  <div data-pop="sheet" style="position: absolute; left: 0; top: 0; width: 360px; height: 780px; z-index: 50; background: rgba(4, 10, 11, 0.88); display: flex; align-items: flex-end">

<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["aqua","coral","iris"],"default":"aqua"},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  theme(mood) {
    const MOODS = {
      coral: { bg: '#0F1320', nav: '#151A2A', surface: '#1A2033', surface2: '#232A42', line: '#2B3350', text: '#FFFFFF', text2: '#D3D8E8', text3: '#A2ABC4', accent: '#FF7A5F', onAccent: '#2A0F0A', ink: '#171B2B' },
      aqua: { bg: '#0B1517', nav: '#101D20', surface: '#152528', surface2: '#1C3034', line: '#24383C', text: '#FFFFFF', text2: '#CBDADC', text3: '#9BB0B3', accent: '#4FD1C5', onAccent: '#04231F', ink: '#0F1E21' },
      iris: { bg: '#100F1C', nav: '#171527', surface: '#1D1B30', surface2: '#27243E', line: '#33304D', text: '#FFFFFF', text2: '#D4D1EC', text3: '#A9A6CA', accent: '#A898FF', onAccent: '#150F33', ink: '#17132B' }
    };
    const t = Object.assign({}, MOODS[mood] || MOODS.aqua);
    t.accentSoft = t.accent + '2E';
    t.tile = '#' + [1, 3, 5].map((i) => Math.round(parseInt(t.surface.slice(i, i + 2), 16) * 0.87 + 33).toString(16).padStart(2, '0')).join('');
    return t;
  }

  kit() {
    if (this._kit) return this._kit;
    const CATS = [
      { id: 'groceries', name: 'Groceries', tile: '#8FDDA0', emoji: '🥦' },
      { id: 'snacks', name: 'Snacks', tile: '#FFB37A', emoji: '🍗' },
      { id: 'transport', name: 'Transportation', tile: '#93C0FF', emoji: '🚍' },
      { id: 'shopping', name: 'Shopping', tile: '#FFA3C4', emoji: '🛍️' },
      { id: 'rent', name: 'House Rent', tile: '#C3B5FF', emoji: '🏠' },
      { id: 'electric', name: 'Electric Bill', tile: '#F5E678', emoji: '⚡' },
      { id: 'internet', name: 'Internet Bill', tile: '#89DCF0', emoji: '🌐' },
      { id: 'phone', name: 'Phone', tile: '#7DE1CD', emoji: '☎️' },
      { id: 'gas', name: 'Gas', tile: '#FFD077', emoji: '🔥' },
      { id: 'health', name: 'Health', tile: '#FF9999', emoji: '💊' },
      { id: 'gym', name: 'Gym', tile: '#CDEA85', emoji: '💪' },
      { id: 'selfcare', name: 'Self Care', tile: '#EAB4F6', emoji: '🧴' },
      { id: 'subs', name: 'Online Subscriptions', tile: '#AAB2FF', emoji: '▶️' },
      { id: 'gifts', name: 'Gifts', tile: '#FFAB99', emoji: '🎁' },
      { id: 'misc', name: 'Miscellaneous', tile: '#DECFB5', emoji: '🧩' }
    ];
    const CAT = {};
    CATS.forEach((c) => { CAT[c.id] = c; });
    this._kit = { CATS, CAT };
    return this._kit;
  }

  defaults() {
    return { picked: 'health', expr: '1180', note: 'Doctor visit', typed: '' };
  }

  pretty(s) {
    if (s === '') return '0';
    const parts = s.split('.');
    const whole = parseInt(parts[0] || '0', 10).toLocaleString('en-US');
    return parts.length > 1 ? whole + '.' + parts[1] : whole;
  }

  calc(expr) {
    const parts = expr.split(/([+−])/);
    let v = parseFloat(parts[0]) || 0;
    for (let i = 1; i < parts.length; i += 2) {
      const n = parseFloat(parts[i + 1]) || 0;
      v = parts[i] === '+' ? v + n : v - n;
    }
    return Math.max(0, Math.round(v * 100) / 100);
  }

  parseQuick(K, s) {
    const words = s.trim().toLowerCase().split(/\s+/).filter((w) => w);
    if (!words.length) return null;
    let amount = null;
    const rest = [];
    words.forEach((w) => {
      const v = w.replace(/,/g, '');
      if (amount === null && /^\d+(\.\d{1,2})?$/.test(v)) amount = parseFloat(v);
      else rest.push(w);
    });
    const KEY = { coffee: 'snacks', tea: 'snacks', snack: 'snacks', bus: 'transport', ride: 'transport', taxi: 'transport', rice: 'groceries', vegetables: 'groceries', fish: 'groceries', bazaar: 'groceries', haircut: 'selfcare', medicine: 'health', doctor: 'health', pharmacy: 'health', netflix: 'subs', recharge: 'phone', electricity: 'electric', wifi: 'internet', gift: 'gifts' };
    let cat = null;
    let consumed = -1;
    rest.forEach((w, i) => {
      if (cat) return;
      const byName = K.CATS.find((c) => w.length >= 3 && c.name.toLowerCase().split(' ').some((p) => p.indexOf(w) === 0));
      if (byName) { cat = byName; consumed = i; return; }
      if (KEY[w]) cat = K.CAT[KEY[w]];
    });
    const noteWords = rest.filter((w, i) => i !== consumed);
    const note = noteWords.length ? noteWords.join(' ').replace(/^./, (ch) => ch.toUpperCase()) : '';
    return { cat, amount, note };
  }

  renderVals() {
    const v = this.popHostVals();
    v.pop = this.popVals(v.t, v);
    return v;
  }

  popKit(t) {
    const mix = (a, b, w) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * w + parseInt(b.slice(i, i + 2), 16) * (1 - w)).toString(16).padStart(2, '0')).join('');
    const dn = (y, m, d) => Math.round(Date.UTC(y, m, d) / 86400000);
    const dt = (n) => new Date(n * 86400000);
    const MS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const ML = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const full = (n) => { const d = dt(n); return MS[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); };
    const soft = t.accent + '2E';
    const stub = mix(t.text3, t.surface2, 0.45);
    // One choice in a list: the current one is tinted, ringed and ticked.
    const opt = (on) => ({ on, bg: on ? soft : t.tile, ring: on ? 'inset 0 0 0 2px ' + t.accent : 'none', fw: on ? '800' : '600', dotBg: on ? t.accent : 'transparent', dotRing: on ? 'none' : 'inset 0 0 0 2px ' + stub });
    return {
      mix, dn, dt, MS, ML, WS, WD, full, opt, soft, stub,
      TODAY: dn(2026, 9, 18),
      bad: '#FF8C9A',
      onBad: '#2A0B12',
      dim: mix(t.text3, t.surface2, 0.5),
      grab: mix(t.text3, t.surface2, 0.4),
      off: mix(t.tile, t.surface2, 0.5)
    };
  }

  // Swiping pulls the neighbouring page into view. Dragging the finger left-to-right or top-to-bottom reveals what is
  // on the left or above (the previous one); dragging right-to-left or bottom-to-top reveals the next one.
  popSwipe(back, forward) {
    return {
      down: (e) => { this._sw = { x: e.clientX, y: e.clientY }; },
      up: (e) => {
        const s = this._sw;
        this._sw = null;
        if (!s) return;
        const dx = e.clientX - s.x;
        const dy = e.clientY - s.y;
        const far = Math.abs(dx) > Math.abs(dy) ? dx : dy;
        if (Math.abs(far) < 24) return;
        this._swiped = Date.now();
        if (far > 0) back(); else forward();
      }
    };
  }

  // A tap that ends a swipe is not a tap.
  popTap(fn) {
    return () => { if (Date.now() - (this._swiped || 0) > 350) fn(); };
  }

  // Choosing the pocket for an expense. A tap picks the pocket and closes the sheet; Save on the Edit screen does the move.
  popVals(t) {
    const k = this.popKit(t);
    const st = this.state || {};
    const cur = st.popPick || 'personal';
    const LIST = [['personal', 'Personal', '👛'], ['business', 'Business', '💼'], ['trip', 'Family trip', '🏖️']];
    return {
      grab: k.grab,
      rows: LIST.map(([id, name, emoji]) => Object.assign(k.opt(id === cur), { name, emoji, pick: () => this.setState({ popPick: id }) }))
    };
  }

  popHostVals() {
    const v = this.quickHostVals();
    v.qv = this.quickVals(v.t);
    // Whenever the keypad is not up, the typing bar is, with a card above it that says what to do next.
    if (!v.showPanel) v.showQuick = true;
    // Whatever needs saying about a typed expense is said inside the preview card, so the line under it is not shown then.
    if (v.qv.show) v.hasHint = false;
    // While a typed expense is on show, the screen stays in type-to-add mode: tapping a category tile sets the category
    // of that expense instead of opening the keypad.
    if (v.qv.show) {
      v.showPanel = false;
      v.showQuick = true;
    }
    // The tile of the category in use is marked, whether the app guessed it from the typed word or the user chose it.
    const inUse = v.qv.show ? (v.qv.known ? v.qv.name : '') : v.qv.guess;
    v.tiles.forEach((c) => {
      if (!inUse || c.name !== inUse) return;
      c.on = true;
      c.ring = '0 0 0 3px ' + v.t.bg + ', 0 0 0 5px ' + v.t.accent + ', 0 0 18px 7px ' + v.t.accent + '96';
      c.labelColor = v.t.accent;
      c.fw = '800';
    });
    // A selected tile is ringed, glows, and is lit from inside: a little of the accent colour is mixed into its fill.
    const lit = '#' + [1, 3, 5].map((i) => Math.round(parseInt(v.t.accent.slice(i, i + 2), 16) * 0.15 + parseInt(v.t.tile.slice(i, i + 2), 16) * 0.85).toString(16).padStart(2, '0')).join('');
    v.tiles.forEach((c) => { if (c.on) c.tile = lit; });
    // While the app is waiting for a category, every tile gets a thin outline: the grid itself looks ready to be tapped.
    if (v.qv.unknown) v.tiles.forEach((c) => { if (!c.on) c.ring = 'inset 0 0 0 1.5px ' + v.t.accent + '73'; });
    return v;
  }

  // Type to add: the preview shows as soon as there is an amount. A word the app has not seen asks for a category once.
  // Tapping a category tile, or the category on the preview, overrides the guess.
  quickVals(t) {
    const K = this.kit();
    const st = Object.assign(this.defaults(), this.state || {});
    const q = this.parseQuick(K, st.typed);
    const typed = (st.typed || '').trim();
    const show = !!(q && q.amount);
    const cat = show ? (st.picked ? K.CAT[st.picked] : q.cat) : null;
    const known = !!cat;
    return {
      show,
      // Before there is an amount, the card above the bar is a guide: pick a category, or finish typing.
      guide: !show,
      // With an amount but no category, a banner under the grid asks for one.
      bannerBg: t.accent + '1F',
      bannerLine: 'inset 0 0 0 1.5px ' + t.accent + '8C',
      bannerTile: t.accent + '33',
      bannerSub: q && q.note ? 'So the app knows where “' + q.note.toLowerCase() + '” goes' : 'So the app knows where this goes',
      guess: !show && !st.picked && q && q.cat ? q.cat.name : '',
      guideIcon: typed ? 'dialpad' : 'touch_app',
      guideTitle: typed ? 'Now add the amount' : 'Select a category',
      guideSub: typed ? 'Like “' + typed + ' 120”' : 'Tap one above, or just type below',
      known,
      unknown: show && !known,
      emoji: known ? cat.emoji : '',
      name: known ? cat.name : 'No category',
      aria: known ? 'Category: ' + cat.name + '. Tap, then pick another one from the grid above' : 'Pick a category from the grid above',
      tile: known ? t.tile : 'transparent',
      tileLine: known ? '0 solid transparent' : '1.5px dashed ' + t.accent,
      nameFg: known ? t.text : t.text2,
      nameFw: known ? '600' : '700',
      sub: show ? (q.note ? q.note + ' \u00B7 ' : '') + 'Today' : '',
      amount: show ? this.pretty(String(q.amount)) : '',
      addBg: known ? t.accent : t.surface2,
      addFg: known ? t.onAccent : t.text3,
      addPe: known ? 'auto' : 'none',
      // A new word asks for a category. Once the user has chosen one by hand, the note says what will happen next time.
      hasNote: show && known && !!st.picked && !!q.note,
      hint: !show ? '' : (!known ? '' : (st.picked && q.note ? 'Next time, “' + q.note.toLowerCase() + '” goes to ' + cat.name + '.' : ''))
    };
  }

  quickHostVals() {
    const K = this.kit();
    const st = Object.assign(this.defaults(), this.state || {});
    const t = this.theme(this.props.mood ?? 'aqua');
    const picked = st.picked;
    const expr = st.expr;
    const hasOp = /[+−]/.test(expr);
    const result = this.calc(expr);
    const pc = picked ? K.CAT[picked] : null;

    const tiles = K.CATS.map((c) => {
      const on = picked === c.id;
      return {
        name: c.name,
        emoji: c.emoji,
        tile: t.tile,
        on,
        ring: on ? '0 0 0 3px ' + t.bg + ', 0 0 0 5px ' + t.accent + ', 0 0 18px 7px ' + t.accent + '96' : 'none',
        labelColor: on ? t.accent : t.text,
        fw: on ? '800' : '600',
        pick: () => this.setState({ picked: on ? null : c.id })
      };
    });

    const press = (k) => () => {
      let e = expr;
      const last = e.split(/[+−]/).pop();
      if (/^[0-9]$/.test(k)) {
        if (last.indexOf('.') >= 0 && last.split('.')[1].length >= 2) return;
        if (last === '0') e = e.slice(0, -1) + k;
        else if (last.replace('.', '').length < 9) e = e + k;
      } else if (k === '.') {
        if (last.indexOf('.') < 0) e = e + (last === '' ? '0.' : '.');
      } else if (k === '+' || k === '−') {
        if (e === '') return;
        e = /[+−]$/.test(e) ? e.slice(0, -1) + k : e + k;
      } else if (k === 'del') {
        e = e.slice(0, -1);
      } else if (k === '=') {
        e = String(this.calc(e));
      }
      this.setState({ expr: e });
    };

    const keyDef = (k) => {
      const base = { isLink: false, isButton: true, hasIcon: false, hasText: true, text: k, icon: '', isz: '22px', bg: t.surface2, fg: t.text, fs: '21px', fw: '700', aria: k, press: press(k) };
      if (k === '+' || k === '−') return Object.assign(base, { fg: t.accent, fs: '25px', fw: '600', aria: k === '+' ? 'Plus' : 'Minus' });
      if (k === 'del') return Object.assign(base, { hasIcon: true, hasText: false, icon: 'backspace', aria: 'Delete last digit' });
      if (k === 'date') return Object.assign(base, { hasIcon: true, text: 'Today', icon: 'calendar_month', isz: '18px', fs: '11.5px', fw: '800', bg: t.accentSoft, fg: t.accent, aria: 'Date: today', press: () => {} });
      if (k === 'ok') {
        if (hasOp) return Object.assign(base, { text: '=', bg: t.accent, fg: t.onAccent, fs: '25px', fw: '700', aria: 'Calculate', press: press('=') });
        if (result > 0) return Object.assign(base, { isLink: true, isButton: false, bg: t.accent, fg: t.onAccent });
        return Object.assign(base, { text: 'Save', fg: t.text3, fs: '15px', fw: '800', aria: 'Save (enter an amount first)', press: () => {} });
      }
      return base;
    };
    const keys = ['7', '8', '9', 'date', '4', '5', '6', '+', '1', '2', '3', '−', '.', '0', 'del', 'ok'].map(keyDef);

    const q = this.parseQuick(K, st.typed);
    const hasPreview = !!(q && q.cat && q.amount);
    let hint = 'Type what it was and how much, like “snacks 120”.';
    if (q && !hasPreview) hint = q.cat ? 'Now add the amount, like “' + q.cat.name.toLowerCase() + ' 120”.' : 'No matching category yet. Tap one above instead.';

    return {
      t,
      tiles,
      keys,
      showPanel: !!pc,
      showQuick: !pc,
      closePanel: () => this.setState({ picked: null }),
      chipLabel: pc ? 'Category: ' + pc.name + '. Tap to change' : '',
      pickedName: pc ? pc.name : '',
      pickedEmoji: pc ? pc.emoji : '',
      pickedTile: t.tile,
      hasOp,
      exprShown: expr.replace(/([+−])/g, ' $1 '),
      bigAmount: hasOp ? this.pretty(String(result)) : this.pretty(expr),
      amountColor: expr === '' ? t.text3 : t.text,
      note: st.note,
      onNote: (ev) => this.setState({ note: ev.target.value }),
      typed: st.typed,
      onTyped: (ev) => this.setState({ typed: ev.target.value }),
      hasPreview,
      hasHint: !hasPreview,
      hint,
      qName: hasPreview ? q.cat.name : '',
      qSub: hasPreview ? (q.note ? q.note + ' · Today' : 'Today') : '',
      qEmoji: hasPreview ? q.cat.emoji : '',
      qTile: t.tile,
      qAmount: hasPreview ? this.pretty(String(q.amount)) : ''
    };
  }
}
</script>
</body>
