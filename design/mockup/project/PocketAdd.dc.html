<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add pocket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=keyboard&amp;display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
.em{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;line-height:1;display:inline-block;flex-shrink:0}
button,input{font-family:inherit}
a{color:inherit}
main::-webkit-scrollbar{display:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;flex-shrink:0;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 360px; height: 780px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="height: 60px; flex-shrink: 0; padding: 0 16px; display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; align-items: center">
    <a href="PocketList.dc.html" style="justify-self: start; width: 80px; height: 36px; border-radius: 18px; background: {{t.surface}}; color: {{t.text}}; font-size: 14px; line-height: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">Cancel</a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; line-height: 24px; font-weight: 800; letter-spacing: -0.2px">{{screenTitle}}</h1>
    <a href="PocketList.dc.html" style="justify-self: end; width: 80px; height: 36px; border-radius: 18px; background: {{saveBg}}; color: {{saveFg}}; pointer-events: {{savePe}}; font-size: 14px; line-height: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Save</a>
  </header>

  <main style="flex: 1; overflow-y: auto; scrollbar-width: none; padding: 2px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Name" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; padding: 16px; display: flex; align-items: center; gap: 12px">
      <span style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 18px; background: {{t.tile}}; display: flex; align-items: center; justify-content: center">
        <span class="em" aria-hidden="true" style="font-size: 28px">{{emoji}}</span>
      </span>
      <input type="text" aria-label="Pocket name" placeholder="Pocket name" value="{{name}}" onChange="{{onName}}" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; border: 0; border-radius: 16px; padding: 0 16px; background: {{t.bg}}; color: {{t.text}}; font-size: 16px; line-height: 24px; font-weight: 700; outline: none">
    </section>

    <section aria-label="Emoji" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; overflow: hidden; display: flex; flex-direction: column">
      <div style="height: 48px; flex-shrink: 0; padding: 0 16px; background: {{t.surface2}}; display: flex; align-items: center">
        <h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 800">Emoji</h2>
      </div>
      <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12.5px; line-height: 16px; font-weight: 600; color: {{t.text3}}">{{g.title}}</span>
            <div style="display: grid; grid-template-columns: repeat(6, 44px); justify-content: space-between">
              <sc-for list="{{g.items}}" as="e" hint-placeholder-count="6">
                <button type="button" aria-pressed="{{e.on}}" onClick="{{e.pick}}" style="width: 44px; height: 44px; border: 0; border-radius: 14px; padding: 0; background: {{e.bg}}; box-shadow: {{e.ring}}; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: box-shadow 0.15s">
                  <span class="em" aria-hidden="true" style="font-size: 22px">{{e.ch}}</span>
                </button>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <button type="button" style="margin-top: 4px; height: 44px; border: 0; border-radius: 14px; padding: 0; background: {{t.surface2}}; color: {{t.text2}}; font-size: 13.5px; line-height: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <span class="ms" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px; color: {{t.text3}}">keyboard</span>
          Pick any emoji from your keyboard
        </button>
      </div>
    </section>

    <sc-if value="{{isAdd}}" hint-placeholder-val="{{ false }}">
      <p style="flex-shrink: 0; margin: 0; border-radius: 20px; background: {{t.surface}}; padding: 14px 16px; font-size: 13px; line-height: 20px; font-weight: 500; color: {{t.text2}}">A new pocket starts empty. Your categories and settings are already in it.</p>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["edit","add"],"default":"add"},"mood":{"editor":"enum","options":["coral","aqua","iris"],"default":"aqua"},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  theme(mood) {
    const MOODS = {
      coral: { bg: '#0F1320', nav: '#151A2A', surface: '#1A2033', line: '#2B3350', text: '#FFFFFF', text2: '#D3D8E8', text3: '#A2ABC4', accent: '#FF7A5F', onAccent: '#2A0F0A', ink: '#171B2B' },
      aqua: { bg: '#0B1517', nav: '#101D20', surface: '#152528', line: '#24383C', text: '#FFFFFF', text2: '#CBDADC', text3: '#9BB0B3', accent: '#4FD1C5', onAccent: '#04231F', ink: '#0F1E21' },
      iris: { bg: '#100F1C', nav: '#171527', surface: '#1D1B30', line: '#33304D', text: '#FFFFFF', text2: '#D4D1EC', text3: '#A9A6CA', accent: '#A898FF', onAccent: '#150F33', ink: '#17132B' }
    };
    const t = Object.assign({}, MOODS[mood] || MOODS.coral);
    // mix(a, b, w): w parts of colour a, the rest colour b.
    const mix = (a, b, w) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * w + parseInt(b.slice(i, i + 2), 16) * (1 - w)).toString(16).padStart(2, '0')).join('');
    t.accentSoft = t.accent + '2E';
    t.surface2 = { coral: '#232A42', aqua: '#1C3034', iris: '#27243E' }[mood] || '#232A42';
    t.tile = '#' + [1, 3, 5].map((i) => Math.round(parseInt(t.surface.slice(i, i + 2), 16) * 0.87 + 33).toString(16).padStart(2, '0')).join('');
    t.accentGlow = t.accent + '59';
    t.wash = t.accent + '29';
    // Chart colours that follow the theme. Category colours do not: they are fixed per category.
    t.other = mix(t.text3, t.surface, 0.5);
    t.barSoft = mix(t.accent, t.surface, 0.6);
    t.barDim = mix(t.accent, t.surface, 0.36);
    t.ramp = [1, 0.86, 0.72, 0.58, 0.44].map((w) => mix(t.accent, t.surface, w));
    t.tip = mix('#FFFFFF', t.surface2, 0.1);
    t.stub = mix(t.text3, t.surface, 0.28);
    t.track = mix(t.bg, t.surface, 0.5);
    // Shared by the other boards: text on accent, the calendar heat ramp, a dim text tone, and the mixer itself.
    t.onAccentDim = t.onAccent + 'D9';
    t.heat = [0.4, 0.56, 0.74, 0.94].map((w) => mix(t.accent, t.bg, w));
    t.dim = mix(t.text3, t.bg, 0.55);
    t.good = '#5BD49B';
    t.bad = '#FF8C9A';
    t.mix = mix;
    return t;
  }

  renderVals() {
    const st = this.state || {};
    const t = this.theme(this.props.mood ?? 'aqua');
    const mode = this.props.mode ?? 'add';
    // Edit opens with the pocket's current name and emoji; Add opens empty with a starter emoji no pocket uses yet.
    const start = mode === 'edit' ? { name: 'Business', emoji: '💼' } : { name: '', emoji: '💰' };
    const name = st.name != null ? st.name : start.name;
    const emoji = st.emoji || start.emoji;
    const GROUPS = [
      ['Everyday', ['👛', '💰', '🏠', '🛒', '🧺', '❤️']],
      ['Work', ['💼', '🏢', '💻', '🛠️', '🏪', '📦']],
      ['Trips and events', ['✈️', '🏖️', '🎉', '💍', '🕌', '🎓']],
      ['Everything else', ['🚗', '🐶', '🌱', '📚', '🎮', '⭐']]
    ];
    return {
      t,
      screenTitle: mode === 'edit' ? 'Edit pocket' : 'Add pocket',
      isAdd: mode === 'add',
      name,
      emoji,
      groups: GROUPS.map(([title, list]) => ({
        title,
        items: list.map((ch) => {
          const on = ch === emoji;
          return { ch, on, bg: on ? t.accentSoft : t.tile, ring: on ? 'inset 0 0 0 2px ' + t.accent : 'none', pick: () => this.setState({ emoji: ch }) };
        })
      })),
      saveBg: name.trim() ? t.accent : t.surface2,
      saveFg: name.trim() ? t.onAccent : t.text3,
      savePe: name.trim() ? 'auto' : 'none',
      onName: (ev) => this.setState({ name: ev.target.value })
    };
  }
}
</script>
</body>
</html>
