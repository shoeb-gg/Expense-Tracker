<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Import, step 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=arrow_back,description,expand_more&amp;display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
.em{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;line-height:1;display:inline-block;flex-shrink:0}
button,input{font-family:inherit}
a{color:inherit}
main::-webkit-scrollbar{display:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;flex-shrink:0;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 360px; height: 780px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="height: 60px; flex-shrink: 0; padding: 0 16px; display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; align-items: center">
    <a href="NewImport.dc.html" aria-label="Back to step 1" style="justify-self: start; width: 40px; height: 40px; border-radius: 20px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <span class="ms" aria-hidden="true" style="font-size: 22px; width: 22px; height: 22px">arrow_back</span>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <h1 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -0.2px; white-space: nowrap">Check the columns</h1>
      <span style="font-size: 12.5px; line-height: 16px; font-weight: 600; color: {{t.text3}}">Step 2 of 3</span>
    </div>
    <span aria-hidden="true"></span>
  </header>

  <main style="flex: 1; overflow-y: auto; scrollbar-width: none; padding: 2px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Chosen file" style="flex-shrink: 0; height: 68px; border-radius: 20px; background: {{t.surface}}; padding: 0 16px; display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{t.tile}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center">
        <span class="ms" style="font-size: 24px; width: 24px; height: 24px">description</span>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">expenses-2025.csv</span>
        <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">312 rows</span>
      </span>
      <a href="NewImport.dc.html" style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.tile}}; font-size: 13px; line-height: 32px; font-weight: 700; color: {{t.text}}; text-decoration: none">Change</a>
    </section>

    <section aria-label="Match the columns" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; overflow: hidden; display: flex; flex-direction: column">
      <div style="height: 48px; flex-shrink: 0; padding: 0 16px; background: {{t.surface2}}; display: flex; align-items: center">
        <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
          <h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 800">Your columns</h2>
          <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">4 of 4 found</span>
        </div>
      </div>
      <div aria-hidden="true" style="margin: 0 16px; padding-top: 12px; display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; font-weight: 600; color: {{t.text3}}">
        <span>In the app</span>
        <span style="width: 124px">Column in your file</span>
      </div>
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <div style="margin: 0 16px; height: 64px; box-shadow: {{f.line}}; display: flex; align-items: center; justify-content: space-between; gap: 12px">
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; line-height: 20px; font-weight: 600">{{f.name}}</span>
            <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}; white-space: nowrap; font-variant-numeric: tabular-nums">{{f.sample}}</span>
          </span>
          <button type="button" aria-label="{{f.aria}}" style="width: 124px; height: 40px; flex-shrink: 0; border: 0; border-radius: 12px; padding: 0 6px 0 12px; background: {{t.tile}}; color: {{t.text}}; font-size: 14px; line-height: 20px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
            <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{f.column}}</span>
            <span class="ms" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px; color: {{t.text3}}">expand_more</span>
          </button>
        </div>
      </sc-for>
    </section>

    <section aria-label="How dates are written" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; overflow: hidden; display: flex; flex-direction: column">
      <div style="height: 48px; flex-shrink: 0; padding: 0 16px; background: {{t.surface2}}; display: flex; align-items: center">
        <h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 800">How dates are written</h2>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <div role="group" aria-label="Date order" style="height: 40px; box-sizing: border-box; padding: 4px; border-radius: 14px; background: {{t.bg}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{orders}}" as="b" hint-placeholder-count="2">
            <button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="height: 32px; border: 0; border-radius: 10px; padding: 0; background: {{b.bg}}; color: {{b.fg}}; font-size: 13.5px; line-height: 20px; font-weight: {{b.fw}}; cursor: pointer; transition: background 0.15s">{{b.label}}</button>
          </sc-for>
        </div>
        <span aria-live="polite" style="text-align: center; font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}; font-variant-numeric: tabular-nums">05/03/2025 is read as <span style="font-weight: 800; color: {{t.text}}">{{readAs}}</span></span>
      </div>
    </section>
  </main>

  <div style="flex-shrink: 0; padding: 12px 16px 14px; background: {{t.nav}}; box-shadow: inset 0 1px 0 {{t.line}}; display: flex; flex-direction: column; gap: 8px">
    <a href="NewImportReview.dc.html" style="height: 52px; border-radius: 18px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 15.5px; line-height: 20px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center">Next</a>
    <span style="text-align: center; font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">Nothing is added until the last step.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["coral","aqua","iris"],"default":"aqua"},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  theme(mood) {
    const MOODS = {
      coral: { bg: '#0F1320', nav: '#151A2A', surface: '#1A2033', line: '#2B3350', text: '#FFFFFF', text2: '#D3D8E8', text3: '#A2ABC4', accent: '#FF7A5F', onAccent: '#2A0F0A', ink: '#171B2B' },
      aqua: { bg: '#0B1517', nav: '#101D20', surface: '#152528', line: '#24383C', text: '#FFFFFF', text2: '#CBDADC', text3: '#9BB0B3', accent: '#4FD1C5', onAccent: '#04231F', ink: '#0F1E21' },
      iris: { bg: '#100F1C', nav: '#171527', surface: '#1D1B30', line: '#33304D', text: '#FFFFFF', text2: '#D4D1EC', text3: '#A9A6CA', accent: '#A898FF', onAccent: '#150F33', ink: '#17132B' }
    };
    const t = Object.assign({}, MOODS[mood] || MOODS.coral);
    // mix(a, b, w): w parts of colour a, the rest colour b.
    const mix = (a, b, w) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * w + parseInt(b.slice(i, i + 2), 16) * (1 - w)).toString(16).padStart(2, '0')).join('');
    t.accentSoft = t.accent + '2E';
    t.surface2 = { coral: '#232A42', aqua: '#1C3034', iris: '#27243E' }[mood] || '#232A42';
    t.tile = '#' + [1, 3, 5].map((i) => Math.round(parseInt(t.surface.slice(i, i + 2), 16) * 0.87 + 33).toString(16).padStart(2, '0')).join('');
    t.accentGlow = t.accent + '59';
    t.wash = t.accent + '29';
    // Chart colours that follow the theme. Category colours do not: they are fixed per category.
    t.other = mix(t.text3, t.surface, 0.5);
    t.barSoft = mix(t.accent, t.surface, 0.6);
    t.barDim = mix(t.accent, t.surface, 0.36);
    t.ramp = [1, 0.86, 0.72, 0.58, 0.44].map((w) => mix(t.accent, t.surface, w));
    t.tip = mix('#FFFFFF', t.surface2, 0.1);
    t.stub = mix(t.text3, t.surface, 0.28);
    t.track = mix(t.bg, t.surface, 0.5);
    // Shared by the other boards: text on accent, the calendar heat ramp, a dim text tone, and the mixer itself.
    t.onAccentDim = t.onAccent + 'D9';
    t.heat = [0.4, 0.56, 0.74, 0.94].map((w) => mix(t.accent, t.bg, w));
    t.dim = mix(t.text3, t.bg, 0.55);
    t.good = '#5BD49B';
    t.bad = '#FF8C9A';
    t.mix = mix;
    return t;
  }

  renderVals() {
    const st = this.state || {};
    const t = this.theme(this.props.mood ?? 'aqua');
    const line = 'inset 0 -1px 0 ' + t.line;
    const order = st.order || 'day';
    const F = [['Date', 'e.g. 05/03/2025', 'Date'], ['Amount', 'e.g. 1,250.00', 'Amount'], ['Category', 'e.g. Groceries', 'Type'], ['Title', 'e.g. Weekly bazaar', 'Note']];
    return {
      t,
      fields: F.map(([name, sample, column], i) => ({ name, sample, column, aria: name + ' comes from the column ' + column + '. Tap to change', line: i < F.length - 1 ? line : 'none' })),
      orders: [['day', 'Day first'], ['month', 'Month first']].map(([key, label]) => {
        const on = key === order;
        return { label, on, bg: on ? t.accent : 'transparent', fg: on ? t.onAccent : t.text2, fw: on ? '800' : '600', pick: () => this.setState({ order: key }) };
      }),
      readAs: order === 'day' ? 'March 5, 2025' : 'May 3, 2025'
    };
  }
}
</script>
</body>
</html>
