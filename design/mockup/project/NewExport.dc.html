<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=arrow_back,calendar_month,check&amp;display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
.em{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;line-height:1;display:inline-block;flex-shrink:0}
button,input{font-family:inherit}
a{color:inherit}
main::-webkit-scrollbar{display:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;flex-shrink:0;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 360px; height: 780px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="height: 60px; flex-shrink: 0; padding: 0 16px; display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; align-items: center">
    <a href="NewSettings.dc.html" aria-label="Back to settings" style="justify-self: start; width: 40px; height: 40px; border-radius: 20px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <span class="ms" aria-hidden="true" style="font-size: 22px; width: 22px; height: 22px">arrow_back</span>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; line-height: 24px; font-weight: 800; letter-spacing: -0.2px">Export</h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="flex: 1; overflow-y: auto; scrollbar-width: none; padding: 2px 16px 24px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Which expenses" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; overflow: hidden; display: flex; flex-direction: column">
      <div style="height: 48px; flex-shrink: 0; padding: 0 16px; background: {{t.surface2}}; display: flex; align-items: center">
        <div style="flex: 1; min-width: 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
          <h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 800">Which expenses</h2>
          <span aria-live="polite" style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}; font-variant-numeric: tabular-nums">{{countText}}</span>
        </div>
      </div>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <div role="group" aria-label="Quick choices" style="margin-bottom: 4px; height: 40px; box-sizing: border-box; padding: 4px; border-radius: 14px; background: {{t.bg}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
          <sc-for list="{{ranges}}" as="b" hint-placeholder-count="3">
            <button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="height: 32px; border: 0; border-radius: 10px; padding: 0; background: {{b.bg}}; color: {{b.fg}}; font-size: 13.5px; line-height: 20px; font-weight: {{b.fw}}; white-space: nowrap; cursor: pointer; transition: background 0.15s">{{b.label}}</button>
          </sc-for>
        </div>
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
          <button type="button" aria-label="{{r.aria}}" style="height: 56px; border: 0; border-radius: 16px; padding: 0 14px 0 16px; background: {{t.tile}}; color: {{t.text}}; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; cursor: pointer">
            <span style="font-size: 13.5px; line-height: 20px; font-weight: 600; color: {{t.text2}}">{{r.label}}</span>
            <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 20px; font-weight: 700; font-variant-numeric: tabular-nums">
              {{r.value}}
              <span class="ms" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px; color: {{t.accent}}">calendar_month</span>
            </span>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-label="File type" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; overflow: hidden; display: flex; flex-direction: column">
      <div style="height: 48px; flex-shrink: 0; padding: 0 16px; background: {{t.surface2}}; display: flex; align-items: center">
        <h2 style="margin: 0; font-size: 15px; line-height: 20px; font-weight: 800">File type</h2>
      </div>
      <div role="radiogroup" aria-label="File type" style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{kinds}}" as="o" hint-placeholder-count="2">
          <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 64px; border: 0; border-radius: 16px; padding: 0 16px; background: {{o.bg}}; box-shadow: {{o.ring}}; color: {{t.text}}; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer; transition: background 0.15s">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; line-height: 20px; font-weight: {{o.fw}}">{{o.label}}</span>
              <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">{{o.sub}}</span>
            </span>
            <span aria-hidden="true" style="width: 24px; height: 24px; flex-shrink: 0; border-radius: 12px; background: {{o.dotBg}}; box-shadow: {{o.dotRing}}; color: {{t.onAccent}}; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}">
                <span class="ms" style="font-size: 18px; width: 18px; height: 18px">check</span>
              </sc-if>
            </span>
          </button>
        </sc-for>
      </div>
      <span style="margin: -4px 16px 16px; text-align: center; font-size: 13px; line-height: 20px; font-weight: 500; color: {{t.text3}}">One row per expense. Photos are left out.</span>
    </section>
  </main>

  <div style="flex-shrink: 0; padding: 12px 16px 14px; background: {{t.nav}}; box-shadow: inset 0 1px 0 {{t.line}}; display: flex; flex-direction: column; gap: 8px">
    <a href="NewSettings.dc.html" style="height: 52px; border-radius: 18px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 15.5px; line-height: 20px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums">{{cta}}</a>
    <span style="text-align: center; font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">Next, you choose where to save or share it.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["coral","aqua","iris"],"default":"aqua"},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  theme(mood) {
    const MOODS = {
      coral: { bg: '#0F1320', nav: '#151A2A', surface: '#1A2033', line: '#2B3350', text: '#FFFFFF', text2: '#D3D8E8', text3: '#A2ABC4', accent: '#FF7A5F', onAccent: '#2A0F0A', ink: '#171B2B' },
      aqua: { bg: '#0B1517', nav: '#101D20', surface: '#152528', line: '#24383C', text: '#FFFFFF', text2: '#CBDADC', text3: '#9BB0B3', accent: '#4FD1C5', onAccent: '#04231F', ink: '#0F1E21' },
      iris: { bg: '#100F1C', nav: '#171527', surface: '#1D1B30', line: '#33304D', text: '#FFFFFF', text2: '#D4D1EC', text3: '#A9A6CA', accent: '#A898FF', onAccent: '#150F33', ink: '#17132B' }
    };
    const t = Object.assign({}, MOODS[mood] || MOODS.coral);
    // mix(a, b, w): w parts of colour a, the rest colour b.
    const mix = (a, b, w) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * w + parseInt(b.slice(i, i + 2), 16) * (1 - w)).toString(16).padStart(2, '0')).join('');
    t.accentSoft = t.accent + '2E';
    t.surface2 = { coral: '#232A42', aqua: '#1C3034', iris: '#27243E' }[mood] || '#232A42';
    t.tile = '#' + [1, 3, 5].map((i) => Math.round(parseInt(t.surface.slice(i, i + 2), 16) * 0.87 + 33).toString(16).padStart(2, '0')).join('');
    t.accentGlow = t.accent + '59';
    t.wash = t.accent + '29';
    // Chart colours that follow the theme. Category colours do not: they are fixed per category.
    t.other = mix(t.text3, t.surface, 0.5);
    t.barSoft = mix(t.accent, t.surface, 0.6);
    t.barDim = mix(t.accent, t.surface, 0.36);
    t.ramp = [1, 0.86, 0.72, 0.58, 0.44].map((w) => mix(t.accent, t.surface, w));
    t.tip = mix('#FFFFFF', t.surface2, 0.1);
    t.stub = mix(t.text3, t.surface, 0.28);
    t.track = mix(t.bg, t.surface, 0.5);
    // Shared by the other boards: text on accent, the calendar heat ramp, a dim text tone, and the mixer itself.
    t.onAccentDim = t.onAccent + 'D9';
    t.heat = [0.4, 0.56, 0.74, 0.94].map((w) => mix(t.accent, t.bg, w));
    t.dim = mix(t.text3, t.bg, 0.55);
    t.good = '#5BD49B';
    t.bad = '#FF8C9A';
    t.mix = mix;
    return t;
  }

  kit() {
    if (this._kit) return this._kit;
    const DAY = 86400000;
    const dn = (y, m, d) => Date.UTC(y, m, d) / DAY;
    const dt = (n) => new Date(n * DAY);
    const TODAY = dn(2026, 9, 18);
    const MS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const ML = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const WS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const fmt = (v) => Math.round(v).toLocaleString('en-US');
    // Chart colours come from a palette checked for colour-blind separation. They are assigned so that
    // categories which rank next to each other in the sample data never share or nearly share a colour.
    const CATS = [
      { id: 'groceries', name: 'Groceries', color: '#41AE61', emoji: '🥦' },
      { id: 'snacks', name: 'Snacks', color: '#9085E9', emoji: '🍗' },
      { id: 'transport', name: 'Transportation', color: '#D55181', emoji: '🚍' },
      { id: 'shopping', name: 'Shopping', color: '#D55181', emoji: '🛍️' },
      { id: 'rent', name: 'House Rent', color: '#3987E5', emoji: '🏠' },
      { id: 'electric', name: 'Electric Bill', color: '#C98500', emoji: '⚡' },
      { id: 'internet', name: 'Internet Bill', color: '#0096AF', emoji: '🌐' },
      { id: 'phone', name: 'Phone', color: '#0096AF', emoji: '☎️' },
      { id: 'gas', name: 'Gas', color: '#D95926', emoji: '🔥' },
      { id: 'health', name: 'Health', color: '#0096AF', emoji: '💊' },
      { id: 'gym', name: 'Gym', color: '#D95926', emoji: '💪' },
      { id: 'selfcare', name: 'Self Care', color: '#E66767', emoji: '🧴' },
      { id: 'subs', name: 'Online Subscriptions', color: '#3987E5', emoji: '▶️' },
      { id: 'gifts', name: 'Gifts', color: '#E66767', emoji: '🎁' },
      { id: 'misc', name: 'Miscellaneous', color: '#9085E9', emoji: '🧩' }
    ];
    const CAT = {};
    CATS.forEach((c) => { CAT[c.id] = c; });
    let a = 20261018;
    const rnd = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
    const NOTES = {
      groceries: ['Weekly bazaar', 'Vegetables & fish', 'Supermarket run', 'Rice & lentils', ''],
      snacks: ['Coffee', 'Tea & biscuits', 'Ice cream', 'Bakery', 'Chips & soda', ''],
      transport: ['Ride to office', 'Ride home', 'Bus fare', ''],
      shopping: ['New shoes', 'T-shirts', 'Kitchen stuff', ''],
      selfcare: ['Haircut', 'Skincare', ''],
      health: ['Pharmacy', 'Doctor visit', ''],
      gifts: ['Birthday gift', 'Wedding gift'],
      misc: ['Laundry', 'Stationery', '']
    };
    const T = [];
    let id = 1;
    const add = (catId, amount, y, m, d, note) => T.push({ id: id++, catId, amount, y, m, d, n: dn(y, m, d), note: note || '', h: 8 + Math.floor(rnd() * 14), mi: Math.floor(rnd() * 60) });
    for (let n = dn(2025, 0, 1); n <= TODAY; n++) {
      const t = dt(n);
      const y = t.getUTCFullYear(), m = t.getUTCMonth(), d = t.getUTCDate(), dow = t.getUTCDay();
      if (d === 1) add('rent', 15000, y, m, d, ML[m] + ' rent');
      if (d === 3) add('gym', 1000, y, m, d, 'Membership');
      if (d === 5) add('internet', 1500, y, m, d, 'Broadband');
      if (d === 8) add('subs', 685, y, m, d, 'Streaming');
      if (d === 12) add('electric', Math.round((2300 + rnd() * 1400) / 10) * 10, y, m, d, ML[m] + ' bill');
      if (d === 20) add('gas', 1150, y, m, d, 'Cooking gas');
      if (d === 2 || d === 16) add('phone', 500, y, m, d, 'Mobile recharge');
      if (rnd() < 0.72) add('snacks', Math.round((60 + rnd() * 380) / 5) * 5, y, m, d, pick(NOTES.snacks));
      if ((dow === 2 || dow === 5) && rnd() < 0.85) add('groceries', Math.round((450 + rnd() * 1800) / 10) * 10, y, m, d, pick(NOTES.groceries));
      if (dow >= 1 && dow <= 5 && rnd() < 0.7) add('transport', Math.round((40 + rnd() * 300) / 10) * 10, y, m, d, pick(NOTES.transport));
      if (rnd() < 0.05) add('shopping', Math.round((800 + rnd() * 3700) / 50) * 50, y, m, d, pick(NOTES.shopping));
      if (rnd() < 0.035) add('selfcare', Math.round((300 + rnd() * 900) / 50) * 50, y, m, d, pick(NOTES.selfcare));
      if (rnd() < 0.03) add('health', Math.round((200 + rnd() * 2300) / 10) * 10, y, m, d, pick(NOTES.health));
      if (rnd() < 0.015) add('gifts', Math.round((500 + rnd() * 2500) / 100) * 100, y, m, d, pick(NOTES.gifts));
      if (rnd() < 0.07) add('misc', Math.round((50 + rnd() * 550) / 10) * 10, y, m, d, pick(NOTES.misc));
    }
    const byDay = {};
    T.forEach((x) => { (byDay[x.n] = byDay[x.n] || []).push(x); });
    const daySum = (n) => (byDay[n] || []).reduce((s, x) => s + x.amount, 0);
    const sum = (s, e) => { let tot = 0; for (let n = s; n <= e; n++) tot += daySum(n); return tot; };
    const byCat = (s, e) => {
      const o = {};
      for (let n = s; n <= e; n++) (byDay[n] || []).forEach((x) => { o[x.catId] = (o[x.catId] || 0) + x.amount; });
      return Object.keys(o).map((k) => ({ cat: CAT[k], amount: o[k] })).sort((p, q) => q.amount - p.amount);
    };
    this._kit = { dn, dt, TODAY, MS, ML, WD, WS, fmt, CAT, byDay, daySum, sum, byCat };
    return this._kit;
  }

  renderVals() {
    const st = this.state || {};
    const t = this.theme(this.props.mood ?? 'aqua');
    const K = this.kit();
    const T = K.TODAY;
    const td = K.dt(T);
    const list = (n) => { const b = K.byDay; const r = typeof b === 'function' ? b(n) : (b instanceof Map ? b.get(n) : (b ? b[n] : null)); return r || []; };
    // "Everything" starts at the first day that has an expense.
    let firstDay = T;
    for (let n = K.dn(2024, 0, 1); n <= T; n++) { if (K.daySum(n) > 0) { firstDay = n; break; } }
    const RANGES = { month: [K.dn(td.getUTCFullYear(), td.getUTCMonth(), 1), T], year: [K.dn(td.getUTCFullYear(), 0, 1), T], all: [firstDay, T] };
    const range = st.range || 'month';
    const from = RANGES[range][0];
    const to = RANGES[range][1];
    let count = 0;
    for (let n = from; n <= to; n++) count += list(n).length;
    const full = (n) => { const d = K.dt(n); return K.MS[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(); };
    const kind = st.kind || 'xlsx';
    const dotLine = t.mix(t.text3, t.tile, 0.5);
    const words = count === 1 ? '1 expense' : K.fmt(count) + ' expenses';
    return {
      t,
      countText: words,
      ranges: [['month', 'This month'], ['year', 'This year'], ['all', 'Everything']].map(([key, label]) => {
        const on = key === range;
        return { label, on, bg: on ? t.accent : 'transparent', fg: on ? t.onAccent : t.text2, fw: on ? '800' : '600', pick: () => this.setState({ range: key }) };
      }),
      rows: [
        { label: 'From', value: full(from), aria: 'From ' + full(from) + '. Tap to change' },
        { label: 'To', value: full(to), aria: 'To ' + full(to) + '. Tap to change' }
      ],
      kinds: [['xlsx', 'Excel (.xlsx)', 'Opens in Excel and Google Sheets'], ['csv', 'CSV (.csv)', 'Plain text, opens in almost any app']].map(([key, label, sub]) => {
        const on = key === kind;
        return { label, sub, on, bg: on ? t.accentSoft : t.tile, ring: on ? 'inset 0 0 0 2px ' + t.accent : 'none', fw: on ? '800' : '600', dotBg: on ? t.accent : 'transparent', dotRing: on ? 'none' : 'inset 0 0 0 2px ' + dotLine, pick: () => this.setState({ kind: key }) };
      }),
      cta: 'Export ' + words
    };
  }
}
</script>
</body>
</html>
