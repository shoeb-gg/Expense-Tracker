<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expense details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&amp;icon_names=arrow_back,calendar_month,chevron_right,delete,donut_small,edit,notes,photo_camera&amp;display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&amp;display=swap">
<style>
html,body{margin:0;overflow:hidden}
.em{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;line-height:1;display:inline-block;flex-shrink:0}
button,input{font-family:inherit}
a{color:inherit}
main::-webkit-scrollbar{display:none}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;display:inline-block;flex-shrink:0;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
</style>
</helmet>
<div style="width: 360px; height: 780px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <header style="height: 60px; flex-shrink: 0; padding: 0 16px; display: grid; grid-template-columns: 88px minmax(0, 1fr) 88px; align-items: center">
    <a href="MoodAqua.dc.html" aria-label="Back to home" style="justify-self: start; width: 40px; height: 40px; border-radius: 20px; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <span class="ms" aria-hidden="true" style="font-size: 22px; width: 22px; height: 22px">arrow_back</span>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 17px; line-height: 24px; font-weight: 800; letter-spacing: -0.2px">Details</h1>
    <span aria-hidden="true"></span>
  </header>

  <main style="flex: 1; overflow-y: auto; scrollbar-width: none; padding: 2px 16px 16px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Expense" style="flex-shrink: 0; border-radius: 24px; background: {{t.accent}}; color: {{t.onAccent}}; padding: 20px 16px; display: flex; flex-direction: column; align-items: center">
      <span style="width: 64px; height: 64px; border-radius: 20px; background: {{t.onAccent}}; display: flex; align-items: center; justify-content: center">
        <span class="em" aria-hidden="true" style="font-size: 32px">{{emoji}}</span>
      </span>
      <span style="margin-top: 10px; font-size: 15px; line-height: 20px; font-weight: 700; color: {{t.onAccentDim}}">{{catName}}</span>
      <span style="margin-top: 2px; font-size: 40px; line-height: 48px; font-weight: 800; letter-spacing: -0.8px">{{amount}}</span>
    </section>

    <section aria-label="More about this expense" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; padding: 4px 0; display: flex; flex-direction: column">
      <sc-if value="{{hasTitle}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; gap: 12px; padding-left: 16px">
          <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{t.tile}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center">
            <span class="ms" aria-hidden="true" style="font-size: 22px; width: 22px; height: 22px">notes</span>
          </span>
          <span style="flex: 1; min-width: 0; height: 68px; margin-right: 16px; box-shadow: inset 0 -1px 0 {{t.line}}; display: flex; flex-direction: column; justify-content: center; gap: 2px">
            <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">Title</span>
            <span style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span>
          </span>
        </div>
      </sc-if>
      <div style="display: flex; align-items: center; gap: 12px; padding-left: 16px">
        <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{t.tile}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center">
          <span class="ms" aria-hidden="true" style="font-size: 22px; width: 22px; height: 22px">calendar_month</span>
        </span>
        <span style="flex: 1; min-width: 0; height: 88px; margin-right: 16px; box-shadow: inset 0 -1px 0 {{t.line}}; display: flex; flex-direction: column; justify-content: center; gap: 2px">
          <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">Date</span>
          <span style="font-size: 15px; line-height: 20px; font-weight: 600">{{dateText}}</span>
          <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">{{addedText}}</span>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding-left: 16px">
        <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{t.tile}}; color: {{t.text2}}; display: flex; align-items: center; justify-content: center">
          <span class="ms" aria-hidden="true" style="font-size: 22px; width: 22px; height: 22px">photo_camera</span>
        </span>
        <span style="flex: 1; min-width: 0; height: 68px; margin-right: 16px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">Photo</span>
            <span style="font-size: 15px; line-height: 20px; font-weight: 600">Receipt, tap to view</span>
          </span>
          <span role="img" aria-label="Receipt photo" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: linear-gradient(135deg, #6A5747, #3F332A); display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 31px; box-sizing: border-box; border-radius: 2.5px; background: #F4F1EA; transform: rotate(-8deg); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 4px"><span style="height: 2px; border-radius: 1px; background: #B9B2A2"></span><span style="width: 70%; height: 2px; border-radius: 1px; background: #CFC9BA"></span><span style="height: 2px; border-radius: 1px; background: #CFC9BA"></span><span style="width: 50%; height: 2px; border-radius: 1px; background: #B9B2A2"></span></span></span>
        </span>
      </div>
    </section>

    <a href="NewCategory.dc.html" aria-label="{{monthAria}}" style="flex-shrink: 0; border-radius: 20px; background: {{t.surface}}; color: {{t.text}}; text-decoration: none; display: flex; align-items: center; gap: 12px; padding-left: 16px">
      <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; background: {{t.tile}}; color: {{t.accent}}; display: flex; align-items: center; justify-content: center">
        <span class="ms" aria-hidden="true" style="font-size: 22px; width: 22px; height: 22px">donut_small</span>
      </span>
      <span style="flex: 1; min-width: 0; height: 76px; margin-right: 16px; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; line-height: 20px; font-weight: 600">{{monthLabel}}</span>
          <span style="font-size: 12.5px; line-height: 16px; font-weight: 500; color: {{t.text3}}">{{monthText}}</span>
        </span>
        <span class="ms" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px; margin-right: -6px; color: {{t.text3}}">chevron_right</span>
      </span>
    </a>

  </main>

  <div style="flex-shrink: 0; padding: 12px 16px 16px; background: {{t.nav}}; box-shadow: inset 0 1px 0 {{t.line}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <a href="NewEdit.dc.html" style="height: 52px; border-radius: 18px; background: {{t.accent}}; color: {{t.onAccent}}; font-size: 15px; line-height: 20px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px">
        <span class="ms" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px">edit</span>
        Edit
      </a>
      <button type="button" onClick="{{askDelete}}" style="height: 52px; border: 0; border-radius: 18px; padding: 0; background: {{t.surface2}}; color: {{t.bad}}; font-size: 15px; line-height: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <span class="ms" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px">delete</span>
        Delete
      </button>
  </div>

  <sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; top: 0; width: 360px; height: 780px; background: rgba(4, 10, 11, 0.88); display: flex; align-items: center; justify-content: center">
      <div role="alertdialog" aria-label="Delete this expense?" style="width: 312px; box-sizing: border-box; padding: 20px; border-radius: 24px; background: {{t.surface2}}; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column">
        <span style="font-size: 17px; line-height: 24px; font-weight: 800; letter-spacing: -0.2px">Delete this expense?</span>
        <span style="margin-top: 8px; font-size: 14px; line-height: 20px; font-weight: 700">{{confirmWhat}}</span>
        <span style="font-size: 13.5px; line-height: 20px; font-weight: 500; color: {{t.text2}}">This can't be undone.</span>
        <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <button type="button" onClick="{{cancelDelete}}" style="height: 48px; border: 0; border-radius: 16px; padding: 0; background: {{t.tile}}; color: {{t.text}}; font-size: 15px; line-height: 20px; font-weight: 700; cursor: pointer">Cancel</button>
          <a href="MoodAqua.dc.html" style="height: 48px; border-radius: 16px; background: {{t.bad}}; color: #2A0B12; font-size: 15px; line-height: 20px; font-weight: 800; text-decoration: none; display: flex; align-items: center; justify-content: center">Delete</a>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["coral","aqua","iris"],"default":"aqua"},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  theme(mood) {
    const MOODS = {
      coral: { bg: '#0F1320', nav: '#151A2A', surface: '#1A2033', line: '#2B3350', text: '#FFFFFF', text2: '#D3D8E8', text3: '#A2ABC4', accent: '#FF7A5F', onAccent: '#2A0F0A', ink: '#171B2B' },
      aqua: { bg: '#0B1517', nav: '#101D20', surface: '#152528', line: '#24383C', text: '#FFFFFF', text2: '#CBDADC', text3: '#9BB0B3', accent: '#4FD1C5', onAccent: '#04231F', ink: '#0F1E21' },
      iris: { bg: '#100F1C', nav: '#171527', surface: '#1D1B30', line: '#33304D', text: '#FFFFFF', text2: '#D4D1EC', text3: '#A9A6CA', accent: '#A898FF', onAccent: '#150F33', ink: '#17132B' }
    };
    const t = Object.assign({}, MOODS[mood] || MOODS.coral);
    // mix(a, b, w): w parts of colour a, the rest colour b.
    const mix = (a, b, w) => '#' + [1, 3, 5].map((i) => Math.round(parseInt(a.slice(i, i + 2), 16) * w + parseInt(b.slice(i, i + 2), 16) * (1 - w)).toString(16).padStart(2, '0')).join('');
    t.accentSoft = t.accent + '2E';
    t.surface2 = { coral: '#232A42', aqua: '#1C3034', iris: '#27243E' }[mood] || '#232A42';
    t.tile = '#' + [1, 3, 5].map((i) => Math.round(parseInt(t.surface.slice(i, i + 2), 16) * 0.87 + 33).toString(16).padStart(2, '0')).join('');
    t.accentGlow = t.accent + '59';
    t.wash = t.accent + '29';
    // Chart colours that follow the theme. Category colours do not: they are fixed per category.
    t.other = mix(t.text3, t.surface, 0.5);
    t.barSoft = mix(t.accent, t.surface, 0.6);
    t.barDim = mix(t.accent, t.surface, 0.36);
    t.ramp = [1, 0.86, 0.72, 0.58, 0.44].map((w) => mix(t.accent, t.surface, w));
    t.tip = mix('#FFFFFF', t.surface2, 0.1);
    t.stub = mix(t.text3, t.surface, 0.28);
    t.track = mix(t.bg, t.surface, 0.5);
    // Shared by the other boards: text on accent, the calendar heat ramp, a dim text tone, and the mixer itself.
    t.onAccentDim = t.onAccent + 'D9';
    t.heat = [0.4, 0.56, 0.74, 0.94].map((w) => mix(t.accent, t.bg, w));
    t.dim = mix(t.text3, t.bg, 0.55);
    t.good = '#5BD49B';
    t.bad = '#FF8C9A';
    t.mix = mix;
    return t;
  }

  kit() {
    if (this._kit) return this._kit;
    const DAY = 86400000;
    const dn = (y, m, d) => Date.UTC(y, m, d) / DAY;
    const dt = (n) => new Date(n * DAY);
    const TODAY = dn(2026, 9, 18);
    const MS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const ML = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const WS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const fmt = (v) => Math.round(v).toLocaleString('en-US');
    // Chart colours come from a palette checked for colour-blind separation. They are assigned so that
    // categories which rank next to each other in the sample data never share or nearly share a colour.
    const CATS = [
      { id: 'groceries', name: 'Groceries', color: '#41AE61', emoji: '🥦' },
      { id: 'snacks', name: 'Snacks', color: '#9085E9', emoji: '🍗' },
      { id: 'transport', name: 'Transportation', color: '#D55181', emoji: '🚍' },
      { id: 'shopping', name: 'Shopping', color: '#D55181', emoji: '🛍️' },
      { id: 'rent', name: 'House Rent', color: '#3987E5', emoji: '🏠' },
      { id: 'electric', name: 'Electric Bill', color: '#C98500', emoji: '⚡' },
      { id: 'internet', name: 'Internet Bill', color: '#0096AF', emoji: '🌐' },
      { id: 'phone', name: 'Phone', color: '#0096AF', emoji: '☎️' },
      { id: 'gas', name: 'Gas', color: '#D95926', emoji: '🔥' },
      { id: 'health', name: 'Health', color: '#0096AF', emoji: '💊' },
      { id: 'gym', name: 'Gym', color: '#D95926', emoji: '💪' },
      { id: 'selfcare', name: 'Self Care', color: '#E66767', emoji: '🧴' },
      { id: 'subs', name: 'Online Subscriptions', color: '#3987E5', emoji: '▶️' },
      { id: 'gifts', name: 'Gifts', color: '#E66767', emoji: '🎁' },
      { id: 'misc', name: 'Miscellaneous', color: '#9085E9', emoji: '🧩' }
    ];
    const CAT = {};
    CATS.forEach((c) => { CAT[c.id] = c; });
    let a = 20261018;
    const rnd = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
    const NOTES = {
      groceries: ['Weekly bazaar', 'Vegetables & fish', 'Supermarket run', 'Rice & lentils', ''],
      snacks: ['Coffee', 'Tea & biscuits', 'Ice cream', 'Bakery', 'Chips & soda', ''],
      transport: ['Ride to office', 'Ride home', 'Bus fare', ''],
      shopping: ['New shoes', 'T-shirts', 'Kitchen stuff', ''],
      selfcare: ['Haircut', 'Skincare', ''],
      health: ['Pharmacy', 'Doctor visit', ''],
      gifts: ['Birthday gift', 'Wedding gift'],
      misc: ['Laundry', 'Stationery', '']
    };
    const T = [];
    let id = 1;
    const add = (catId, amount, y, m, d, note) => T.push({ id: id++, catId, amount, y, m, d, n: dn(y, m, d), note: note || '', h: 8 + Math.floor(rnd() * 14), mi: Math.floor(rnd() * 60) });
    for (let n = dn(2025, 0, 1); n <= TODAY; n++) {
      const t = dt(n);
      const y = t.getUTCFullYear(), m = t.getUTCMonth(), d = t.getUTCDate(), dow = t.getUTCDay();
      if (d === 1) add('rent', 15000, y, m, d, ML[m] + ' rent');
      if (d === 3) add('gym', 1000, y, m, d, 'Membership');
      if (d === 5) add('internet', 1500, y, m, d, 'Broadband');
      if (d === 8) add('subs', 685, y, m, d, 'Streaming');
      if (d === 12) add('electric', Math.round((2300 + rnd() * 1400) / 10) * 10, y, m, d, ML[m] + ' bill');
      if (d === 20) add('gas', 1150, y, m, d, 'Cooking gas');
      if (d === 2 || d === 16) add('phone', 500, y, m, d, 'Mobile recharge');
      if (rnd() < 0.72) add('snacks', Math.round((60 + rnd() * 380) / 5) * 5, y, m, d, pick(NOTES.snacks));
      if ((dow === 2 || dow === 5) && rnd() < 0.85) add('groceries', Math.round((450 + rnd() * 1800) / 10) * 10, y, m, d, pick(NOTES.groceries));
      if (dow >= 1 && dow <= 5 && rnd() < 0.7) add('transport', Math.round((40 + rnd() * 300) / 10) * 10, y, m, d, pick(NOTES.transport));
      if (rnd() < 0.05) add('shopping', Math.round((800 + rnd() * 3700) / 50) * 50, y, m, d, pick(NOTES.shopping));
      if (rnd() < 0.035) add('selfcare', Math.round((300 + rnd() * 900) / 50) * 50, y, m, d, pick(NOTES.selfcare));
      if (rnd() < 0.03) add('health', Math.round((200 + rnd() * 2300) / 10) * 10, y, m, d, pick(NOTES.health));
      if (rnd() < 0.015) add('gifts', Math.round((500 + rnd() * 2500) / 100) * 100, y, m, d, pick(NOTES.gifts));
      if (rnd() < 0.07) add('misc', Math.round((50 + rnd() * 550) / 10) * 10, y, m, d, pick(NOTES.misc));
    }
    const byDay = {};
    T.forEach((x) => { (byDay[x.n] = byDay[x.n] || []).push(x); });
    const daySum = (n) => (byDay[n] || []).reduce((s, x) => s + x.amount, 0);
    const sum = (s, e) => { let tot = 0; for (let n = s; n <= e; n++) tot += daySum(n); return tot; };
    const byCat = (s, e) => {
      const o = {};
      for (let n = s; n <= e; n++) (byDay[n] || []).forEach((x) => { o[x.catId] = (o[x.catId] || 0) + x.amount; });
      return Object.keys(o).map((k) => ({ cat: CAT[k], amount: o[k] })).sort((p, q) => q.amount - p.amount);
    };
    this._kit = { dn, dt, TODAY, MS, ML, WD, WS, fmt, CAT, byDay, daySum, sum, byCat };
    return this._kit;
  }

  renderVals() {
    const K = this.kit();
    const st = this.state || {};
    const t = this.theme(this.props.mood ?? 'aqua');
    // The sample shows today's latest expense; in the app this screen opens for whichever expense was tapped.
    const xs = (K.byDay[K.TODAY] || []).slice().sort((p, r) => (r.h * 60 + r.mi) - (p.h * 60 + p.mi));
    const x = xs[0];
    const c = K.CAT[x.catId];
    const d = K.dt(x.n);
    const hh = x.h % 12 === 0 ? 12 : x.h % 12;
    const time = hh + ':' + String(x.mi).padStart(2, '0') + (x.h < 12 ? ' AM' : ' PM');
    const amount = K.fmt(x.amount);
    // This category's spending in the same month, for context.
    let monthSum = 0, monthCount = 0;
    for (let n = K.dn(d.getUTCFullYear(), d.getUTCMonth(), 1); n <= K.TODAY; n++) (K.byDay[n] || []).forEach((y) => { if (y.catId === c.id) { monthSum += y.amount; monthCount++; } });
    return {
      t,
      emoji: c.emoji,
      catName: c.name,
      amount,
      hasTitle: !!x.note,
      title: x.note,
      dateText: K.WD[d.getUTCDay()] + ', ' + K.ML[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear(),
      addedText: 'Added ' + K.MS[d.getUTCMonth()] + ' ' + d.getUTCDate() + ', ' + d.getUTCFullYear() + ' at ' + time,
      monthLabel: 'See all ' + c.name + ' in ' + K.ML[d.getUTCMonth()],
      monthText: monthCount === 1 ? '1 expense so far' : monthCount + ' expenses so far',
      monthAria: 'See all ' + c.name + ' expenses this month',
      confirm: !!st.confirm,
      confirmWhat: (x.note || c.name) + ' \u00B7 ' + amount,
      askDelete: () => this.setState({ confirm: true }),
      cancelDelete: () => this.setState({ confirm: false })
    };
  }
}
</script>
</body>
</html>
