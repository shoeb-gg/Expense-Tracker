# Analyzer settings for Spill the Bills.
# `flutter analyze` must report no issues. Hand-written code never uses
# `dynamic` or untyped code; the strict modes below enforce most of that.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - build/**

linter:
  rules:
    - avoid_dynamic_calls
    - prefer_single_quotes
    - prefer_final_locals
    - always_declare_return_types
    - unawaited_futures
